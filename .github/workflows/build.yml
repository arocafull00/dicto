name: Instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión
        shell: bash
        run: echo "DICTO_VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.$GITHUB_RUN_NUMBER)" >> $GITHUB_ENV
      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/dicto.spec
      - name: Instalador
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:DICTO_VERSION" "/DOutputName=Dicto-$env:DICTO_VERSION-windows-setup" packaging\dicto.iss
      - uses: actions/upload-artifact@v4
        id: sin-firmar
        with:
          name: dicto-windows-sin-firmar
          path: dist/*-setup.exe
          compression-level: 0
      - name: Firmar con SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: dicto
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Sin firma
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: bash
        run: mkdir signed && cp dist/*-setup.exe signed/
      - uses: actions/upload-artifact@v4
        with:
          name: dicto-windows
          path: signed/*-setup.exe
          compression-level: 0

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión
        run: echo "DICTO_VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.$GITHUB_RUN_NUMBER)" >> $GITHUB_ENV
      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/dicto.spec
      - name: Firma ad hoc
        run: codesign --force --deep --sign - dist/Dicto.app
      - name: Imagen de disco
        run: |
          mkdir dmg
          ditto dist/Dicto.app dmg/Dicto.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Dicto -srcfolder dmg -ov -format UDZO "dist/Dicto-$DICTO_VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dicto-macos
          path: dist/*-macos.dmg
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Instalador con nombre fijo
        run: |
          cp artifacts/dicto-windows/*-windows-setup.exe artifacts/Dicto-Windows-Setup.exe
          cp artifacts/dicto-macos/*-macos.dmg artifacts/Dicto-macOS.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Dicto-Windows-Setup.exe
            artifacts/dicto-windows/*-windows-setup.exe
            artifacts/Dicto-macOS.dmg
            artifacts/dicto-macos/*-macos.dmg
          draft: true
